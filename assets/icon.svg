<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24407f"/>
      <stop offset="1" stop-color="#0d1a3d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#shine)"/>

  <!-- ink stroke left by the pen -->
  <path d="M 282 748 C 360 712, 420 812, 500 772 S 640 722, 730 768"
        fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="26" stroke-linecap="round"/>

  <!-- fountain pen, drawn upright then tilted 45deg (nib to bottom-left) -->
  <g transform="rotate(45 540 470)">
    <!-- cap end -->
    <rect x="478" y="120" width="124" height="70" rx="40" fill="#ffffff"/>
    <!-- barrel -->
    <rect x="478" y="206" width="124" height="384" rx="22" fill="#ffffff"/>
    <!-- grip -->
    <path d="M 482 606 L 598 606 L 584 676 L 496 676 Z" fill="#ffffff"/>
    <!-- nib -->
    <path d="M 500 692 L 580 692 L 580 724 Q 580 780 540 842 Q 500 780 500 724 Z" fill="#ffffff"/>
    <!-- nib slit and breather hole -->
    <line x1="540" y1="752" x2="540" y2="836" stroke="#13244f" stroke-width="9" stroke-linecap="round"/>
    <circle cx="540" cy="742" r="13" fill="#13244f"/>
  </g>
</svg>
