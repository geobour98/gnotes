[package]
name = "gnotes-core"
description = "The gnotes vault: encrypted notes in one SQLCipher file, independent of any UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23"
getrandom = "0.4.3"
hex = "0.4.3"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
