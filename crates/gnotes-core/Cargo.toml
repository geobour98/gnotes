[package]
name = "gnotes-core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
