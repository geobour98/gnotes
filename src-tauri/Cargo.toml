[package]
name = "gnotes"
description = "gnotes desktop app (Tauri): encrypted Markdown notes"
authors = ["geobour98"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gnotes-core = { version = "0.1.0", path = "../crates/gnotes-core" }
zeroize = "1.9.1"
tauri-plugin-dialog = "2"

# Screen-lock / sleep notifications from logind (local D-Bus). Already a
# dependency of tauri-plugin-opener, so this adds no new crates.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "2"


